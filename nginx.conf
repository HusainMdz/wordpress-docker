server {
    listen 80;
    root /var/www/html;
    index index.php;

    client_max_body_size 5G;
    client_header_timeout 600s;
    client_body_timeout 600s;

    # Compress text as production does, so local measurements are comparable.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript text/javascript application/json
               image/svg+xml application/xml text/plain;

    # Same refusals as staging: the webroot is the git checkout. Keep these
    # above "location ~ \.php$": nginx takes the first regex that matches.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~ ^/(?:bin|config|vendor)/ {
        deny all;
    }

    location ~ ^/(?:LOG\.md|README\.md|composer\.(?:json|lock)|wp-config-docker\.php)$ {
        deny all;
    }

    location ~* \.(?:log|sql)$ {
        deny all;
    }

    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_intercept_errors on;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
    }
}
