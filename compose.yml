name: rederma
services:
  db:
    image: mysql:8.0.44 # from production [6-jul-2026]
    ports:
      - "3306:3306" # for local development only
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpressuser
      MYSQL_PASSWORD: wordpresspassword
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    depends_on:
      - db
    image: wordpress:php8.3-fpm-alpine # from production [6-jul-2026]
    volumes:
      - ../src:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpressuser
      WORDPRESS_DB_PASSWORD: wordpresspassword
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', true);
        define('WP_MEMORY_LIMIT', '512M');
        @ini_set('display_errors', 1);
        @ini_set('display_startup_errors', 1);
        @ini_set('error_reporting', E_ALL);
        @ini_set('log_errors', 1);
        @ini_set('error_log', '/var/www/html/wp-content/log/debug.log');

  webserver:
    depends_on:
      - wordpress
    image: nginx:1.24-alpine # from production [6-jul-2026]
    ports:
      - "80:80" # for local development only
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../src:/var/www/html

volumes: # setup persistent storage for database and application data in Docker volumes
  db_data:
  # app_data:   # as we will use src folder for application data, we don't need a separate volume for it